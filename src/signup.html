<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up — Admin Template</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 0;
      }

      .signup-card {
        width: 100%;
        max-width: 480px;
      }

      .password-strength {
        height: 4px;
        border-radius: 2px;
        transition: width 0.3s, background-color 0.3s;
      }
    </style>
</head>

<body>
<div class="signup-card px-3">
    <div class="text-center mb-4">
        <div class="brand-icon mb-3">
            <i class="bi bi-grid-1x2-fill"></i>
        </div>
        <h4 class="fw-bold mb-1">Create an account</h4>
        <p class="text-muted small mb-0">Get started with CleanBoard for free</p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <form id="signup-form" novalidate>
                <div class="row g-3">

                    <div class="col-6">
                        <label class="form-label" for="first-name">First Name</label>
                        <input type="text" id="first-name" class="form-control" placeholder="Alice" required autocomplete="given-name">
                        <div class="invalid-feedback">Required.</div>
                    </div>
                    <div class="col-6">
                        <label class="form-label" for="last-name">Last Name</label>
                        <input type="text" id="last-name" class="form-control" placeholder="Martin" required autocomplete="family-name">
                        <div class="invalid-feedback">Required.</div>
                    </div>

                    <div class="col-12">
                        <label class="form-label" for="email">Email address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" id="email" class="form-control" placeholder="alice@example.com" required autocomplete="email">
                            <div class="invalid-feedback">Enter a valid email address.</div>
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="8" autocomplete="new-password">
                            <button class="btn btn-outline-secondary" type="button" id="pwd-toggle" tabindex="-1">
                                <i class="bi bi-eye" id="pwd-icon"></i>
                            </button>
                            <div class="invalid-feedback">Password must be at least 8 characters.</div>
                        </div>
                        <!-- Strength meter -->
                        <div class="mt-2">
                            <div class="d-flex gap-1 mb-1">
                                <div class="flex-grow-1 bg-light rounded" style="height:4px;"><div class="password-strength h-100 rounded" id="bar-1"></div></div>
                                <div class="flex-grow-1 bg-light rounded" style="height:4px;"><div class="password-strength h-100 rounded" id="bar-2"></div></div>
                                <div class="flex-grow-1 bg-light rounded" style="height:4px;"><div class="password-strength h-100 rounded" id="bar-3"></div></div>
                                <div class="flex-grow-1 bg-light rounded" style="height:4px;"><div class="password-strength h-100 rounded" id="bar-4"></div></div>
                            </div>
                            <div class="text-muted" style="font-size:0.75rem;" id="strength-label"></div>
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label" for="confirm-password">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" id="confirm-password" class="form-control" placeholder="••••••••" required autocomplete="new-password">
                            <div class="invalid-feedback" id="confirm-feedback">Passwords do not match.</div>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="terms" required>
                            <label class="form-check-label small" for="terms">
                                I agree to the <a href="#" class="text-decoration-none">Terms of Service</a> and <a href="#" class="text-decoration-none">Privacy Policy</a>
                            </label>
                            <div class="invalid-feedback">You must agree to continue.</div>
                        </div>
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-dark w-100" id="submit-btn">
                            Create account
                        </button>
                    </div>

                </div>
            </form>

            <div class="divider-text my-4">or sign up with</div>

            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary w-50 d-flex align-items-center justify-content-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M24 9.5c3.1 0 5.6 1.1 7.6 2.9l5.7-5.7C33.8 3.5 29.2 1.5 24 1.5 14.9 1.5 7.2 7.1 4 15l6.6 5.1C12.3 13.6 17.6 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.4 5.7c4.3-4 6.2-9.9 6.2-16.9z"/>
                        <path fill="#FBBC05" d="M10.6 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6L3.7 14.3A23 23 0 0 0 1 24c0 3.7.9 7.2 2.5 10.3l7.1-5.7z"/>
                        <path fill="#34A853" d="M24 46.5c5.9 0 10.9-2 14.5-5.3l-7.4-5.7c-2 1.3-4.5 2.1-7.1 2.1-6.3 0-11.7-4.2-13.6-9.8l-6.9 5.3C7.3 41.1 15 46.5 24 46.5z"/>
                    </svg>
                    Google
                </button>
                <button class="btn btn-outline-secondary w-50 d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-github fs-6"></i>
                    GitHub
                </button>
            </div>
        </div>
    </div>

    <p class="text-center text-muted small mt-4">
        Already have an account? <a href="login.html" class="text-decoration-none fw-semibold">Sign in</a>
    </p>
</div>

<!-- Bootstrap & JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>

<script>
  // Password visibility toggle
  document.getElementById("pwd-toggle").addEventListener("click", () => {
    const input = document.getElementById("password");
    const icon = document.getElementById("pwd-icon");
    const isPassword = input.type === "password";
    input.type = isPassword ? "text" : "password";
    icon.className = isPassword ? "bi bi-eye-slash" : "bi bi-eye";
  });

  // Password strength meter
  document.getElementById("password").addEventListener("input", (e) => {
    const val = e.target.value;
    const bars = [1, 2, 3, 4].map(i => document.getElementById(`bar-${i}`));
    const label = document.getElementById("strength-label");

    const hasLength  = val.length >= 8;
    const hasUpper   = /[A-Z]/.test(val);
    const hasNumber  = /[0-9]/.test(val);
    const hasSpecial = /[^A-Za-z0-9]/.test(val);
    const score = [hasLength, hasUpper, hasNumber, hasSpecial].filter(Boolean).length;

    const levels = [
      { color: "bg-danger",  text: "Weak" },
      { color: "bg-danger",  text: "Weak" },
      { color: "bg-warning", text: "Fair" },
      { color: "bg-info",    text: "Good" },
      { color: "bg-success", text: "Strong" },
    ];

    bars.forEach((bar, i) => {
      bar.className = "password-strength h-100 rounded";
      if (val.length > 0 && i < score) bar.classList.add(levels[score].color);
    });

    label.textContent = val.length > 0 ? levels[score].text : "";
    label.className = val.length > 0
      ? `text-${levels[score].color.replace("bg-", "")} fw-semibold`
      : "text-muted";
  });

  // Form submission
  document.getElementById("signup-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const form = e.currentTarget;
    const password = document.getElementById("password");
    const confirm  = document.getElementById("confirm-password");

    // Check password match before running native validation
    if (password.value !== confirm.value) {
      confirm.setCustomValidity("Passwords do not match.");
    } else {
      confirm.setCustomValidity("");
    }

    form.classList.add("was-validated");
    if (!form.checkValidity()) return;

    const btn = document.getElementById("submit-btn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Creating account…';

    // Simulate async sign-up — replace with real auth logic
    setTimeout(() => {
      window.location.href = "index.html";
    }, 1500);
  });

  // Re-validate confirm field on each keystroke
  document.getElementById("confirm-password").addEventListener("input", () => {
    const password = document.getElementById("password");
    const confirm  = document.getElementById("confirm-password");
    confirm.setCustomValidity(password.value !== confirm.value ? "Passwords do not match." : "");
  });
</script>
</body>
</html>
