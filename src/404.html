<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
      body {
        font-family: system-ui, sans-serif;
        background-color: #f5f6fa;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .error-code {
        font-size: clamp(6rem, 20vw, 10rem);
        font-weight: 800;
        line-height: 1;
        color: #1f2937;
        letter-spacing: -0.04em;
        user-select: none;
      }

      .error-code span {
        color: #0d6efd;
      }

      .error-icon {
        font-size: 3rem;
        color: #9ca3af;
      }
    </style>
</head>

<body>

    <div class="text-center" style="max-width: 480px;">

        <div class="error-code mb-2">4<span>0</span>4</div>

        <i class="bi bi-compass error-icon mb-3 d-block"></i>

        <h1 class="h3 fw-semibold mb-2">Page not found</h1>
        <p class="text-muted mb-4">
            The page you're looking for doesn't exist or has been moved.<br>
            Double-check the URL or head back to the dashboard.
        </p>

        <div class="d-flex flex-wrap justify-content-center gap-2">
            <a href="index.html" class="btn btn-primary">
                <i class="bi bi-speedometer2 me-1"></i> Go to Dashboard
            </a>
            <button class="btn btn-outline-secondary" onclick="history.back()">
                <i class="bi bi-arrow-left me-1"></i> Go Back
            </button>
        </div>

    </div>

    <footer class="position-absolute bottom-0 start-0 end-0 text-center pb-3">
        <small class="text-muted">&copy; 2026 CleanBoard. All rights reserved.</small>
    </footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
