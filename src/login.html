<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Admin Template</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
      body {
        font-family: system-ui, sans-serif;
        background-color: #f5f6fa;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-card {
        width: 100%;
        max-width: 420px;
      }

      .brand-icon {
        width: 48px;
        height: 48px;
        background-color: #1f2937;
        border-radius: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 1.4rem;
      }

      .divider-text {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        color: #9ca3af;
        font-size: 0.8rem;
      }
      .divider-text::before,
      .divider-text::after {
        content: '';
        flex: 1;
        height: 1px;
        background: #e5e7eb;
      }
    </style>
</head>

<body>
<div class="login-card px-3">
    <div class="text-center mb-4">
        <div class="brand-icon mb-3">
            <i class="bi bi-grid-1x2-fill"></i>
        </div>
        <h4 class="fw-bold mb-1">Welcome back</h4>
        <p class="text-muted small mb-0">Sign in to your CleanBoard account</p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <form id="login-form" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="email">Email address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="email" class="form-control" placeholder="alice@example.com" required autocomplete="email">
                        <div class="invalid-feedback">Enter a valid email address.</div>
                    </div>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label mb-0" for="password">Password</label>
                        <a href="#" class="small text-decoration-none">Forgot password?</a>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" minlength="6">
                        <button class="btn btn-outline-secondary" type="button" id="pwd-toggle" tabindex="-1">
                            <i class="bi bi-eye" id="pwd-icon"></i>
                        </button>
                        <div class="invalid-feedback">Password must be at least 6 characters.</div>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label small" for="remember">Remember me for 30 days</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-dark w-100" id="submit-btn">
                    Sign in
                </button>
            </form>

            <div class="divider-text my-4">or continue with</div>

            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary w-50 d-flex align-items-center justify-content-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M24 9.5c3.1 0 5.6 1.1 7.6 2.9l5.7-5.7C33.8 3.5 29.2 1.5 24 1.5 14.9 1.5 7.2 7.1 4 15l6.6 5.1C12.3 13.6 17.6 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.4 5.7c4.3-4 6.2-9.9 6.2-16.9z"/>
                        <path fill="#FBBC05" d="M10.6 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6L3.7 14.3A23 23 0 0 0 1 24c0 3.7.9 7.2 2.5 10.3l7.1-5.7z"/>
                        <path fill="#34A853" d="M24 46.5c5.9 0 10.9-2 14.5-5.3l-7.4-5.7c-2 1.3-4.5 2.1-7.1 2.1-6.3 0-11.7-4.2-13.6-9.8l-6.9 5.3C7.3 41.1 15 46.5 24 46.5z"/>
                    </svg>
                    Google
                </button>
                <button class="btn btn-outline-secondary w-50 d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-github fs-6"></i>
                    GitHub
                </button>
            </div>
        </div>
    </div>

    <p class="text-center text-muted small mt-4">
        Don't have an account? <a href="signup.html" class="text-decoration-none fw-semibold">Sign up</a>
    </p>
</div>

<!-- Bootstrap & JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // Password visibility toggle
  document.getElementById("pwd-toggle").addEventListener("click", () => {
    const input = document.getElementById("password");
    const icon = document.getElementById("pwd-icon");
    const isPassword = input.type === "password";
    input.type = isPassword ? "text" : "password";
    icon.className = isPassword ? "bi bi-eye-slash" : "bi bi-eye";
  });

  // Form validation + loading state
  document.getElementById("login-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const form = e.currentTarget;
    form.classList.add("was-validated");

    if (!form.checkValidity()) return;

    const btn = document.getElementById("submit-btn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Signing in…';

    // Simulate async login — replace with real auth logic
    setTimeout(() => {
      window.location.href = "index.html";
    }, 1500);
  });
</script>
</body>
</html>
